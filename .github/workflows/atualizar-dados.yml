name: Atualizar dados do painel

# Roda quando alguém sobe um novo forms/respostas.xlsx (ou o forms/excluir.txt),
# e também pelo botão "Run workflow" na aba Actions.
on:
  push:
    branches: [main]
    paths:
      - "forms/respostas.xlsx"
      - "forms/excluir.txt"
      - "scripts/atualizar_dados.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pandas openpyxl

      - name: Gerar data/acoes.csv a partir do Excel do Forms
        run: python scripts/atualizar_dados.py forms/respostas.xlsx data/acoes.csv

      - name: Salvar no repositório (se mudou)
        run: |
          if git diff --quiet -- data/acoes.csv; then
            echo "Nada mudou em data/acoes.csv."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/acoes.csv
          git commit -m "Atualiza data/acoes.csv a partir de forms/respostas.xlsx"
          git push
